<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="[占位] 一句话描述网站核心价值" />

    <!-- 浏览器 UI 主题色引导值：与 :root 的 --c-bg-rgb 对应。
         运行时由 src/lib/theme.ts 的 applyTheme() 按当前主题重写。 -->
    <meta name="theme-color" content="#0B0F14" />

    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <title>[占位] 品牌名 - 一句话核心价值</title>

    <!-- 主题预热：在样式与脚本之前确定 data-theme，避免深浅色闪烁（FOUC）。
         必须与 src/lib/theme.ts 的 STORAGE_KEY 保持一致。 -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem("xchannel-theme");
          var theme =
            stored === "light" || stored === "dark"
              ? stored
              : window.matchMedia("(prefers-color-scheme: light)").matches
                ? "light"
                : "dark";
          document.documentElement.setAttribute("data-theme", theme);
        } catch (e) {
          document.documentElement.setAttribute("data-theme", "dark");
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
